plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stalingino.sudoku'
    compileSdk 35

    defaultConfig {
        applicationId 'com.stalingino.sudoku'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Signed with the debug key so the release APK installs directly.
            // Replace with your own signingConfig before publishing to a store.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // ./gradlew testDebugUnitTest -PscreenshotDir=/some/dir renders screens to PNG.
            systemProperty 'screenshotDir', project.findProperty('screenshotDir') ?: ''
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
